<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b3d91" />
  <meta name="description" content="CSL-Wiki — offline-capable Confluence wiki client for Android." />
  <title>CSL-Wiki</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="appbar">
    <button id="panel-toggle" class="icon-btn" aria-label="Menu">☰</button>
    <div class="brand">CSL&nbsp;<span>Wiki</span></div>
    <button id="btn-logout" class="icon-btn" title="Log out / switch server" aria-label="Log out">⏻</button>
    <div id="conn-badge" class="badge">● …</div>
  </header>

  <div id="start-screen" class="start-screen">
    <div class="start-card">
      <h1>CSL-Wiki</h1>
      <p class="sub">Your Confluence wiki — offline-ready on your phone.</p>
      <button id="btn-demo" class="primary-btn">Try the demo</button>
      <div class="divider"><span>or connect your server</span></div>
      <form id="login-form" class="login-form" autocomplete="on">
        <label>Server URL
          <input id="login-server" type="url" value="https://w.csl.by" placeholder="https://w.csl.by" />
        </label>
        <label>Username
          <input id="login-user" type="text" autocomplete="username" placeholder="username" />
        </label>
        <label>Password
          <input id="login-pass" type="password" autocomplete="current-password" placeholder="password" />
        </label>
        <details class="adv">
          <summary>Advanced</summary>
          <label>API path <span class="hint">(REST endpoint — not a key)</span>
            <input id="login-apipath" type="text" value="/wiki/api/v2" placeholder="/wiki/api/v2" />
          </label>
          <label class="check">
            <input id="login-direct" type="checkbox" />
            Connect directly (your browser → server; needs CORS on the server)
          </label>
        </details>
        <button type="submit" class="primary-btn">Connect</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>
  </div>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section class="panel">
        <div class="panel-head">
          <h2>Spaces</h2>
          <button id="btn-new" class="mini-btn" title="New page">＋</button>
        </div>
        <ul id="spaces" class="list"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Pages</h2></div>
        <ul id="page-list" class="list"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Bookmarks</h2></div>
        <ul id="bookmarks" class="list"></ul>
      </section>

      <section class="panel sync-panel">
        <div class="panel-head"><h2>Sync</h2></div>
        <button id="btn-sync" class="primary-btn">⟳ Sync now</button>
        <div id="sync-status" class="sync-status"></div>
        <div id="sync-meta" class="sync-meta"></div>
        <label class="sim">
          <input type="checkbox" id="sim-offline" /> Simulate offline
        </label>
      </section>
    </aside>

    <main class="content">
      <article id="reader" class="reader hidden">
        <div class="reader-bar">
          <button id="btn-close-reader" class="icon-btn">✕</button>
          <h1 id="page-title"></h1>
          <div class="reader-actions">
            <button id="btn-edit" class="mini-btn">✎ Edit</button>
            <button id="btn-bookmark" class="mini-btn">☆ Bookmark</button>
            <button id="btn-sync-page" class="mini-btn" disabled>↑ Sync</button>
          </div>
        </div>
        <div id="page-meta" class="page-meta"></div>
        <div id="page-content" class="page-content"></div>
      </article>

      <section id="agent" class="agent">
        <div class="agent-head">
          <span class="agent-icon">🤖</span>
          <div>
            <strong>Wiki Agent</strong>
            <div class="agent-sub">Ask about anything in your spaces — works on cached content offline.</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div class="agent-input">
          <input id="agent-input" type="text" placeholder="e.g. How does offline sync work?" />
          <button id="btn-agent" class="primary-btn">Ask</button>
        </div>
      </section>

      <div id="toast" class="toast"></div>
      <div id="update-banner" class="update-banner">
        <span id="update-text">New version available</span>
        <button id="btn-update" class="mini-btn">Update</button>
        <button id="btn-update-later" class="mini-btn ghost">Later</button>
      </div>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
