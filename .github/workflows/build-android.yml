name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create a release on tag

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (manual, no third-party action)
        run: |
          ANDROID_HOME=$HOME/android-sdk
          ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          CMDTOOLS=$ANDROID_HOME/cmdline-tools
          mkdir -p "$CMDTOOLS"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$CMDTOOLS"
          mv "$CMDTOOLS/cmdline-tools" "$CMDTOOLS/latest"
          # Export PATH for THIS step; $GITHUB_PATH only applies to later steps.
          export PATH="$CMDTOOLS/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$CMDTOOLS/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Test API and offline sync
        run: npm test

      - name: Write app version (baked into the build for update checks)
        run: |
          VERSION_CODE=${{ github.run_number }}
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="0.0.$VERSION_CODE"; fi
          VERSION="${TAG#v}"
          printf '{"version":"%s","versionCode":%s}' "$VERSION" "$VERSION_CODE" > public/version.json
          echo "App version set to $VERSION (code $VERSION_CODE)"

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Bump versionCode so updates install over previous builds
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK (release with secrets, otherwise installable debug)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ORG_GRADLE_PROJECT_RELEASE_STORE_FILE="$RUNNER_TEMP/release-key.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"
            trap 'rm -f "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"' EXIT
            ./gradlew assembleRelease --no-daemon
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "Release tags require Android signing secrets."
              exit 1
            fi
            echo "No signing secrets configured; building a debug APK (not an update for release installs)."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: csl-wiki-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
