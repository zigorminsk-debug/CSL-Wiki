name: Android APK
on:
  push:
    branches: ['arena/10685d80-csl-wiki']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          export ANDROID_HOME="$HOME/csl-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, Android lint and APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            python3 -c 's=open("build.log").read()[-16000:]; print("::error title=Android build diagnostics::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit "$RESULT"
          fi
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Native Activity smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-smoke.sh
      - name: Name APK and write checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CSL-Wiki-Android.apk
          sha256sum artifacts/CSL-Wiki-Android.apk > artifacts/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSL-Wiki-Android
          path: artifacts/
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
